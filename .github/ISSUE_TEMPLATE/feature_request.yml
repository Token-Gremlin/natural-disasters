name: Feature or technique request
description: Suggest a rendering technique, weather event or improvement
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why it matters
      description: What does it add that the current simulation cannot express?
    validations:
      required: true

  - type: textarea
    id: refs
    attributes:
      label: References
      description: >
        Papers, talks, shader breakdowns or reference footage. Links to prior
        art make a technique request far easier to act on.

  - type: textarea
    id: cost
    attributes:
      label: Expected cost
      description: >
        Any sense of what this would cost per frame, and which quality presets
        could afford it.
